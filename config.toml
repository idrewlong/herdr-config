onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "tokyo-night"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# lazygit over the current layout, like tmux display-popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

# Cheat sheet: workspaces, keys, what the bars mean (cheatsheet.md in this repo)
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "bat --style=plain --language=md --paging=always ~/.config/herdr/cheatsheet.md 2>/dev/null || less ~/.config/herdr/cheatsheet.md"
width = "80%"
height = "85%"

[[keys.command]]
key = ["prefix+u", "prefix+shift+u"]
type = "plugin_action"
command = "herdr-pacer.dock-toggle"
description = "show or hide the usage dock"

[ui]
accent = "blue"

# Glyphs make blocked/working/done easy to tell apart at a glance
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# Left to right: every agent's state + all Claude todo progress (scripts/herdr-bar.sh), Claude's
# 5h and weekly usage (herdr-pacer), then the tmux status-right: zoom flag, #h, clock
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/scripts/herdr-bar.sh", interval_seconds = 2, timeout_seconds = 2 },
  { type = "command", command = "'@PACER_BIN@' tabbar claude", interval_seconds = 30, timeout_seconds = 3 },
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = "  │  "

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

# Desktop notification through mako when a background agent finishes or needs approval
[ui.toast]
delivery = "system"

# Different sounds for "done" (soft rising chime) and "needs you" (sharp double ping), so a
# blocked agent is audible without looking. Made with ffmpeg; regenerate or swap freely.
[ui.sound]
enabled = true
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

# Space rows: sidebar number (herdr-numbering plugin), name, the workspace's agents (●working
# ▲blocked ✓done), branch, and the summed Claude todo
# progress of its panes (scripts/herdr-bar.sh). Empty values and rows disappear.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$number", fg = "#565f89" }, { token = "workspace", bold = true }, { token = "$wsagents", fg = "#e0af68", rules = [{ contains = "▲", fg = "#f7768e", bold = true }] }],
  [{ token = "branch", fg = "#7dcfff" }, "git_status"],
  [{ token = "$wsbar", fg = "#7aa2f7", rules = [{ starts_with = "▰▰▰▰▰▰▰▰", fg = "#9ece6a" }] }, { token = "$wscount", fg = "#565f89" }],
]

# Agent rows (herdr-pacer rewrites `rows` when its settings change; the Claude layout below is
# ours and repeats its bars). Claude panes get a todo progress bar, the current todo and the latest tool call,
# reported live by scripts/claude-progress.py (Claude Code hooks in ~/.claude/settings.json).
# Colors are tokyo-night. Unreported tokens and empty rows disappear.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [{ token = "$pacer_ctx_ok", fg = "#00af50" }, { token = "$pacer_ctx_warn", fg = "#ffb055" }, { token = "$pacer_ctx_hot", fg = "#e6c800" }, { token = "$pacer_ctx_crit", fg = "#ff5555" }, { token = "$pacer_ctx", fg = "#46424e" }],
  [{ token = "$pacer_5h_ok", fg = "#00af50" }, { token = "$pacer_5h_warn", fg = "#ffb055" }, { token = "$pacer_5h_hot", fg = "#e6c800" }, { token = "$pacer_5h_crit", fg = "#ff5555" }, { token = "$pacer_5h", fg = "#46424e" }],
  [{ token = "$pacer_wk_ok", fg = "#00af50" }, { token = "$pacer_wk_warn", fg = "#ffb055" }, { token = "$pacer_wk_hot", fg = "#e6c800" }, { token = "$pacer_wk_crit", fg = "#ff5555" }, { token = "$pacer_wk", fg = "#46424e" }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", dim = true }],
  [{ token = "$bar", fg = "#7aa2f7", rules = [{ starts_with = "▰▰▰▰▰▰▰▰", fg = "#9ece6a" }] }, { token = "$count", fg = "#565f89" }],
  [{ token = "$step", fg = "#c0caf5", rules = [{ starts_with = "✓", fg = "#9ece6a" }] }],
  [{ token = "$doing", fg = "#565f89", rules = [
    { starts_with = "$", fg = "#e0af68" },
    { starts_with = "✎", fg = "#9ece6a" },
    { starts_with = "↯", fg = "#bb9af7" },
    { starts_with = "⌕", fg = "#7dcfff" },
    { starts_with = "◍", fg = "#7dcfff" },
  ] }],
  # herdr-pacer bars (context window, 5h, weekly), colored by how full they are
  [{ token = "$pacer_ctx_ok", fg = "#9ece6a" }, { token = "$pacer_ctx_warn", fg = "#ff9e64" }, { token = "$pacer_ctx_hot", fg = "#e0af68" }, { token = "$pacer_ctx_crit", fg = "#f7768e" }, { token = "$pacer_ctx", fg = "#3b4261" }],
  [{ token = "$pacer_5h_ok", fg = "#9ece6a" }, { token = "$pacer_5h_warn", fg = "#ff9e64" }, { token = "$pacer_5h_hot", fg = "#e0af68" }, { token = "$pacer_5h_crit", fg = "#f7768e" }, { token = "$pacer_5h", fg = "#3b4261" }],
  [{ token = "$pacer_wk_ok", fg = "#9ece6a" }, { token = "$pacer_wk_warn", fg = "#ff9e64" }, { token = "$pacer_wk_hot", fg = "#e0af68" }, { token = "$pacer_wk_crit", fg = "#f7768e" }, { token = "$pacer_wk", fg = "#3b4261" }],
  [{ token = "$wsnum", dim = true }, { token = "workspace", dim = true }, { token = "tab", dim = true }],
]
